name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: Build & Verify Modernization Stack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Verify Go Formatting & Compilation
        run: |
          test -z "$(gofmt -l gateway services/orders-go services/inventory-go)"
          (cd gateway && go test -race ./...)
          (cd services/orders-go && go test -race ./...)
          (cd services/inventory-go && go test -race ./...)
          npm run unit
          (cd gateway && go build -v .)
          (cd services/orders-go && go build -v .)
          (cd services/inventory-go && go build -v .)

      - name: Run Dual-Domain Contract Tests
        run: |
          cd contracts
          npm test

      - name: Run Multi-Phase Smoke & Rollback Suite
        run: |
          node scripts/smoke.js --start

      - name: Run Agentic Modernization Lifecycle Demo
        run: |
          node agent/demo.js
